name: Download from Google Drive

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: 'Google Drive file ID/URL or folder URL'
        required: true
        default: 'https://drive.google.com/file/d/1raLz9TybKGxMCsWVjjdoBnbraUXDgmQ0'
  push:
    branches: [ main, master ]
    paths: [ '.github/workflows/download-gdrive.yml' ]

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gdown
        run: pip install -U gdown

      - name: Resolve input
        id: id
        run: |
          INPUT="${{ github.event.inputs.file_id || '' }}"
          [ -z "$INPUT" ] && INPUT="https://drive.google.com/file/d/1raLz9TybKGxMCsWVjjdoBnbraUXDgmQ0"
          KIND=file
          if echo "$INPUT" | grep -q '/folders/'; then
            ID=$(printf '%s' "$INPUT" | grep -oP '(?<=/folders/)[^/?]+')
            KIND=folder
          elif echo "$INPUT" | grep -q '/d/'; then
            ID=$(printf '%s' "$INPUT" | grep -oP '(?<=/d/)[^/]+')
          elif echo "$INPUT" | grep -q 'id='; then
            ID=$(printf '%s' "$INPUT" | grep -oP '(?<=id=)[^&]+')
          else
            ID="$INPUT"
          fi
          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "kind=$KIND" >> $GITHUB_OUTPUT
          echo "Resolved: kind=$KIND id=$ID"

      - name: Download from Google Drive
        run: |
          rm -rf downloads
          mkdir -p downloads
          cd downloads
          KIND="${{ steps.id.outputs.kind }}"
          ID="${{ steps.id.outputs.id }}"
          if [ "$KIND" = "folder" ]; then
            gdown --folder "https://drive.google.com/drive/folders/$ID" || true
          else
            gdown --fuzzy "https://drive.google.com/file/d/$ID/view" || true
          fi
          if ! find . -type f | grep -q .; then
            echo "::error::gdown produced no files (maybe Google quota-limited or private)."
            exit 1
          fi
          echo "## Downloaded files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lhR
          TOTAL=$(find . -type f -printf '%s\n' | awk '{s+=$1} END{print s+0}')
          COUNT=$(find . -type f | wc -l)
          MAXF=$(find . -type f -printf '%s\n' | sort -nr | head -1)
          find . -type f -print0 | sort -z | while IFS= read -r -d '' f; do
            SIZE=$(stat -c%s "$f")
            echo "- \`$f\` - $(numfmt --to=iec --suffix=B $SIZE)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total:** $(numfmt --to=iec --suffix=B $TOTAL) across $COUNT file(s); largest: $(numfmt --to=iec --suffix=B $MAXF)" >> $GITHUB_STEP_SUMMARY
          if [ "$MAXF" -gt 2030105544 ]; then
            echo "::notice::Largest file exceeds GitHub Release 2GB limit; skipping Release, using artifact only."
            echo "do_release=false" >> $GITHUB_ENV
          else
            echo "do_release=true" >> $GITHUB_ENV
          fi

      - name: Compute SHA256
        run: |
          echo "## SHA256 checksums" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cd downloads
          find . -type f -print0 | sort -z | while IFS= read -r -d '' f; do
            DIGEST=$(sha256sum "$f" | awk '{print $1}')
            echo "- \`$f\`: \`$DIGEST\`" >> $GITHUB_STEP_SUMMARY
            echo "$f  $DIGEST"
          done

      - name: Upload to GitHub Release (skipped if any file > 1.9 GB)
        id: release
        if: env.do_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gdrive-${{ github.run_id }}
          name: "Google Drive download #${{ github.run_number }}"
          make_latest: false
          body: |
            Downloaded from Google Drive
            - kind: ${{ steps.id.outputs.kind }}
            - source id: ${{ steps.id.outputs.id }}
            Files and SHA256 checksums are listed in the workflow Summary.
          files: downloads/**/*.pth
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add download info to summary
        if: always()
        run: |
          echo "## Download links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          URL="${{ steps.release.outputs.html_url }}"
          if [ -n "$URL" ]; then
            echo "Release page: $URL" >> $GITHUB_STEP_SUMMARY
          else
            echo "Skipped GitHub Release (file too large for 2GB limit, or step skipped). Download via the Artifacts section below." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdrive-download
          path: downloads
          if-no-files-found: error
          retention-days: 30
