name: Download from Google Drive

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: 'Google Drive file ID or URL (default: the configured file)'
        required: true
        default: '1Ox-51cz9UZGi7S4XiwRyoSGpJegwzcC3'
  push:
    branches: [ main, master ]
    paths: [ '.github/workflows/download-gdrive.yml' ]

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gdown
        run: pip install -U gdown

      - name: Resolve file ID
        id: id
        run: |
          INPUT="${{ github.event.inputs.file_id || '' }}"
          [ -z "$INPUT" ] && INPUT="1Ox-51cz9UZGi7S4XiwRyoSGpJegwzcC3"
          ID=$(printf '%s' "$INPUT" | grep -oP '(?<=/d/)[^/]+|(?<=id=)[^&]+' | head -1)
          [ -z "$ID" ] && ID="$INPUT"
          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "Resolved file ID: $ID"

      - name: Download from Google Drive
        run: |
          mkdir -p downloads
          cd downloads
          gdown "https://drive.google.com/uc?id=${{ steps.id.outputs.id }}" || true
          if ! ls -A . >/dev/null 2>&1; then
            echo "::error::gdown produced no files."
            exit 1
          fi
          echo "## Downloaded files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh
          for f in *; do
            [ -f "$f" ] || continue
            SIZE=$(stat -c%s "$f")
            echo "- \`$f\` - $(numfmt --to=iec --suffix=B $SIZE)" >> $GITHUB_STEP_SUMMARY
          done

      - name: Compute SHA256
        run: |
          echo "## SHA256 checksums (of the raw downloaded file)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cd downloads
          for f in *; do
            [ -f "$f" ] || continue
            DIGEST=$(sha256sum "$f" | awk '{print $1}')
            echo "- \`$f\`: \`$DIGEST\`" >> $GITHUB_STEP_SUMMARY
            echo "$f  $DIGEST"
          done

      - name: Commit to repo (skip if > 90MB)
        run: |
          OVERSIZE=0
          for f in downloads/*; do
            [ -f "$f" ] || continue
            SIZE=$(stat -c%s "$f")
            if [ "$SIZE" -gt 94371840 ]; then
              echo "::warning::File $f ($(numfmt --to=iec --suffix=B $SIZE)) exceeds GitHub's 100MB limit; skipping commit."
              OVERSIZE=1
            fi
          done
          if [ "$OVERSIZE" = "1" ]; then
            echo "Skipping commit due to oversize file(s). Download via the workflow artifact instead."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add downloaded file from Google Drive (ID: ${{ steps.id.outputs.id }})"
            git push
          fi

      - name: Upload artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdrive-download
          path: downloads/*
          if-no-files-found: error
          retention-days: 30
