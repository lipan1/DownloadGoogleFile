name: Download from OneDrive

on:
  workflow_dispatch:
    inputs:
      share_url:
        description: 'OneDrive share URL'
        required: true
        default: 'https://1drv.ms/u/s!AimBgYV7JjTlgSMjp1_NrV3VRSmK?e=Q1uZKs'
  push:
    branches: [ main, master ]
    paths: [ '.github/workflows/download-onedrive.yml' ]

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Redeem then inspect download HTML
        run: |
          FULL="https://onedrive.live.com/:u:/g/personal/E534267B85818129/s!AimBgYV7JjTlgSMjp1_NrV3VRSmK?resid=E534267B85818129!163&e=Q1uZKs&migratedtospo=true&redeem=aHR0cHM6Ly8xZHJ2Lm1zL3UvcyFBaW1CZ1lWN0pqVGxnU01qcDFfTnJWM1ZUU21LP2U9UTF1Wktz"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          RESID="E534267B85818129!163"
          AUTHKEY="!AimBgYV7JjTlgSMjp1_NrV3VRSmK"
          mkdir -p downloads
          curl -sL -A "$UA" -c cookies.txt -b cookies.txt --max-redirs 20 "$FULL" -o page.html
          DL="https://onedrive.live.com/download?resid=${RESID}&authkey=${AUTHKEY}"
          curl -sL -A "$UA" -b cookies.txt -D dl_hdr.txt --max-time 300 "$DL" -o dl.html
          echo "## download? response headers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat dl_hdr.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "dl.html size: $(stat -c%s dl.html) bytes" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Inspect dl.html" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "--- title ---" >> $GITHUB_STEP_SUMMARY
          grep -oE '<title>[^<]*</title>' dl.html | head -2 >> $GITHUB_STEP_SUMMARY || echo "(none)"
          echo "--- meta refresh / window.location ---" >> $GITHUB_STEP_SUMMARY
          grep -oE '<meta[^>]*http-equiv=["'"'"']?refresh["'"'"']?[^>]*>' dl.html | head -3 >> $GITHUB_STEP_SUMMARY || echo "(none)"
          grep -oE 'window\.location[^;]*' dl.html | head -3 >> $GITHUB_STEP_SUMMARY || echo "(none)"
          echo "--- sharepoint URLs ---" >> $GITHUB_STEP_SUMMARY
          grep -oE 'https://[^"'"'"' <>\\]*sharepoint[^"'"'"' <>\\]*' dl.html | sort -u | head -20 >> $GITHUB_STEP_SUMMARY || echo "(none)"
          echo "--- download.aspx / guestaccess URLs ---" >> $GITHUB_STEP_SUMMARY
          grep -oE 'https://[^"'"'"' <>\\]*(download\.aspx|guestaccess)[^"'"'"' <>\\]*' dl.html | sort -u | head -20 >> $GITHUB_STEP_SUMMARY || echo "(none)"
          echo "--- blob/core/permalink URLs ---" >> $GITHUB_STEP_SUMMARY
          grep -oE 'https://[^"'"'"' <>\\]*(blob|core|permalink|\.live\.com/download)[^"'"'"' <>\\]*' dl.html | sort -u | head -20 >> $GITHUB_STEP_SUMMARY || echo "(none)"
          echo "--- first 1500 chars (text only) ---" >> $GITHUB_STEP_SUMMARY
          sed -e 's/<[^>]*>//g' dl.html | tr -s ' \n' ' ' | head -c 1500 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cp dl.html downloads/ 2>/dev/null || true
          cp dl_hdr.txt downloads/ 2>/dev/null || true
          cp page.html downloads/ 2>/dev/null || true
          cp cookies.txt downloads/ 2>/dev/null || true

      - name: Upload artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onedrive-inspect
          path: downloads
          if-no-files-found: ignore
          retention-days: 7
