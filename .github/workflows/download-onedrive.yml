name: Download from OneDrive

on:
  workflow_dispatch:
    inputs:
      share_url:
        description: 'OneDrive share URL (1drv.ms or onedrive.live.com)'
        required: true
        default: 'https://1drv.ms/u/s!AimBgYV7JjTlgSMjp1_NrV3VRSmK?e=Q1uZKs'
  push:
    branches: [ main, master ]
    paths: [ '.github/workflows/download-onedrive.yml' ]

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve share to final URL (GET, cookies, browser UA)
        run: |
          FULL="https://onedrive.live.com/:u:/g/personal/E534267B85818129/s!AimBgYV7JjTlgSMjp1_NrV3VRSmK?resid=E534267B85818129!163&e=Q1uZKs&migratedtospo=true&redeem=aHR0cHM6Ly8xZHJ2Lm1zL3UvcyFBaW1CZ1lWN0pqVGxnU01qcDFfTnJWM1ZUU21LP2U9UTF1Wktz"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          mkdir -p downloads
          echo "## GET with cookies + browser UA (follow redirects)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -sL -A "$UA" -c cookies.txt -b cookies.txt --max-redirs 20 -D hdr.txt "$FULL" -o page.html 2>&1
          echo "--- response headers ---" >> $GITHUB_STEP_SUMMARY
          cat hdr.txt >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "--- page.html size: $(stat -c%s page.html 2>/dev/null) bytes ---" >> $GITHUB_STEP_SUMMARY
          echo "--- sharepoint URLs found in page ---" >> $GITHUB_STEP_SUMMARY
          grep -oE 'https://[^"'"'"' <>]*sharepoint[^"'"'"' <>]*' page.html | sort -u | head -30 >> $GITHUB_STEP_SUMMARY || echo "(none)"
          echo "--- download URLs found in page ---" >> $GITHUB_STEP_SUMMARY
          grep -oE 'https://[^"'"'"' <>]*download[^"'"'"' <>]*' page.html | sort -u | head -30 >> $GITHUB_STEP_SUMMARY || echo "(none)"
          echo "--- guestaccess URLs ---" >> $GITHUB_STEP_SUMMARY
          grep -oE 'https://[^"'"'"' <>]*guestaccess[^"'"'"' <>]*' page.html | sort -u | head -10 >> $GITHUB_STEP_SUMMARY || echo "(none)"
          echo "--- final effective URL ---" >> $GITHUB_STEP_SUMMARY
          curl -s -o /dev/null -A "$UA" -c cookies.txt -b cookies.txt --max-redirs 20 -w '%{url_effective}\n' "$FULL" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cp page.html downloads/ 2>/dev/null || true
          cp cookies.txt downloads/ 2>/dev/null || true
          cp hdr.txt downloads/ 2>/dev/null || true

      - name: Upload artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onedrive-discovery
          path: downloads
          if-no-files-found: ignore
          retention-days: 7
